<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-left">
      <h1>Form Builder</h1>
      <span class="header-tag">Visual</span>
    </div>
    <div class="header-actions">
      <button id="btn-reset" class="btn btn-ghost" title="Reset form">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>
      <button id="btn-download" class="btn btn-secondary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download HTML
      </button>
      <button id="btn-copy" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy HTML
      </button>
    </div>
  </header>

  <main>
    <!-- Left: Element Palette -->
    <aside class="palette-panel">
      <h2 class="panel-title">Elements</h2>
      <div class="palette-grid" id="palette">
        <div class="palette-item" draggable="true" data-type="text">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M9 20h6"/><path d="M12 4v16"/></svg>
          <span>Text Input</span>
        </div>
        <div class="palette-item" draggable="true" data-type="email">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          <span>Email</span>
        </div>
        <div class="palette-item" draggable="true" data-type="password">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span>Password</span>
        </div>
        <div class="palette-item" draggable="true" data-type="number">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 17l6-12"/><path d="M14 17l6-12"/><path d="M3 10h7"/><path d="M14 10h7"/></svg>
          <span>Number</span>
        </div>
        <div class="palette-item" draggable="true" data-type="textarea">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h10"/><path d="M7 12h10"/><path d="M7 17h6"/></svg>
          <span>Textarea</span>
        </div>
        <div class="palette-item" draggable="true" data-type="select">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m7 15 5 5 5-5"/><path d="m7 9 5-5 5 5"/></svg>
          <span>Dropdown</span>
        </div>
        <div class="palette-item" draggable="true" data-type="checkbox">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 12 2 2 4-4"/></svg>
          <span>Checkbox</span>
        </div>
        <div class="palette-item" draggable="true" data-type="radio">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
          <span>Radio</span>
        </div>
        <div class="palette-item" draggable="true" data-type="date">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          <span>Date</span>
        </div>
        <div class="palette-item" draggable="true" data-type="file">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>File Upload</span>
        </div>
        <div class="palette-item" draggable="true" data-type="range">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="2" y1="12" x2="22" y2="12"/><circle cx="14" cy="12" r="3"/></svg>
          <span>Range</span>
        </div>
        <div class="palette-item" draggable="true" data-type="color">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="currentColor" opacity="0.3"/></svg>
          <span>Color</span>
        </div>
      </div>

      <div class="form-settings">
        <h2 class="panel-title">Form Settings</h2>
        <div class="setting-group">
          <label>Form Title</label>
          <input type="text" id="form-title" placeholder="My Form" value="My Form">
        </div>
        <div class="setting-group">
          <label>Action URL</label>
          <input type="text" id="form-action" placeholder="/submit">
        </div>
        <div class="setting-group">
          <label>Method</label>
          <select id="form-method">
            <option value="POST">POST</option>
            <option value="GET">GET</option>
          </select>
        </div>
        <div class="setting-group">
          <label>Style Theme</label>
          <select id="form-style">
            <option value="basic">Basic</option>
            <option value="modern" selected>Modern</option>
            <option value="material">Material</option>
            <option value="bootstrap">Bootstrap-like</option>
          </select>
        </div>
      </div>
    </aside>

    <!-- Center: Canvas -->
    <section class="canvas-panel">
      <div class="canvas-header">
        <h2 class="panel-title">Canvas</h2>
        <span class="element-count" id="element-count">0 elements</span>
      </div>
      <div class="canvas" id="canvas">
        <div class="canvas-empty" id="canvas-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity="0.3"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
          <p>Drag elements here to build your form</p>
        </div>
      </div>
    </section>

    <!-- Right: Preview & Config -->
    <aside class="right-panel">
      <!-- Element Config (shown when element selected) -->
      <div class="config-panel" id="config-panel" style="display:none;">
        <div class="config-header">
          <h2 class="panel-title">Configure</h2>
          <button class="btn-icon" id="config-close" title="Close">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div id="config-fields"></div>
      </div>

      <!-- Preview -->
      <div class="preview-panel">
        <div class="preview-header">
          <h2 class="panel-title">Live Preview</h2>
        </div>
        <div class="preview-frame" id="preview-frame"></div>
      </div>

      <!-- HTML Output -->
      <div class="output-panel">
        <h2 class="panel-title">HTML Output</h2>
        <pre class="code-output"><code id="html-output"></code></pre>
      </div>
    </aside>
  </main>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script src="app.js"></script>
</body>
</html>
