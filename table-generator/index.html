<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Table Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast-container"></div>

  <header>
    <h1>Table Generator</h1>
    <p class="subtitle">Create, style, and export tables in HTML, Markdown, or CSV</p>
  </header>

  <main>
    <section class="controls-panel">
      <div class="control-group">
        <label>Grid Size</label>
        <div class="size-inputs">
          <div class="input-pair">
            <input type="number" id="row-count" min="1" max="20" value="3">
            <span>rows</span>
          </div>
          <span class="separator">&times;</span>
          <div class="input-pair">
            <input type="number" id="col-count" min="1" max="20" value="3">
            <span>cols</span>
          </div>
          <button id="btn-generate" class="btn btn-primary">Generate</button>
        </div>
      </div>

      <div class="control-group">
        <label>Table Style</label>
        <select id="table-style">
          <option value="basic">Basic</option>
          <option value="striped">Striped</option>
          <option value="bordered">Bordered</option>
          <option value="minimal">Minimal</option>
          <option value="dark">Dark</option>
        </select>
      </div>

      <div class="control-group">
        <label>Options</label>
        <div class="toggle-row">
          <label class="toggle">
            <input type="checkbox" id="header-toggle" checked>
            <span class="toggle-slider"></span>
          </label>
          <span>Header row</span>
        </div>
      </div>

      <div class="control-group">
        <label>Rows &amp; Columns</label>
        <div class="btn-row">
          <button id="btn-add-row" class="btn btn-sm">+ Row</button>
          <button id="btn-remove-row" class="btn btn-sm btn-danger">- Row</button>
          <button id="btn-add-col" class="btn btn-sm">+ Column</button>
          <button id="btn-remove-col" class="btn btn-sm btn-danger">- Column</button>
        </div>
      </div>

      <div class="control-group">
        <label>Cell Actions</label>
        <div class="btn-row">
          <button id="btn-merge" class="btn btn-sm">Merge Selected</button>
          <button id="btn-unmerge" class="btn btn-sm">Unmerge</button>
        </div>
        <div class="btn-row" style="margin-top:6px;">
          <button class="btn btn-sm btn-align" data-align="left" title="Align Left">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
          </button>
          <button class="btn btn-sm btn-align" data-align="center" title="Align Center">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="6" y1="12" x2="18" y2="12"/><line x1="5" y1="18" x2="19" y2="18"/></svg>
          </button>
          <button class="btn btn-sm btn-align" data-align="right" title="Align Right">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="6" y1="18" x2="21" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="control-group">
        <label>Import CSV</label>
        <textarea id="csv-input" placeholder="Paste CSV data here..." rows="4"></textarea>
        <button id="btn-import-csv" class="btn btn-sm" style="margin-top:6px;">Import</button>
      </div>
    </section>

    <section class="table-area">
      <div class="table-wrapper">
        <table id="data-table"></table>
      </div>
      <p class="hint">Click a cell to edit. Click and drag to select a range for merging or alignment.</p>
    </section>

    <section class="output-panel">
      <div class="output-tabs">
        <button class="tab active" data-tab="html">HTML</button>
        <button class="tab" data-tab="markdown">Markdown</button>
        <button class="tab" data-tab="csv">CSV</button>
      </div>
      <div class="output-box">
        <pre id="output-code"></pre>
        <button id="btn-copy" class="btn btn-copy" title="Copy to clipboard">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
