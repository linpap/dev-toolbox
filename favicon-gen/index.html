<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>Favicon Generator</h1>
      <p class="subtitle">Create favicons from text, emoji, or images</p>
    </header>

    <div class="layout">
      <section class="panel controls-panel">
        <h2>Create from Text</h2>

        <div class="control-group">
          <label for="favicon-text">Text / Emoji (1-2 chars)</label>
          <input type="text" id="favicon-text" maxlength="2" value="A" placeholder="A" autocomplete="off">
        </div>

        <div class="control-row">
          <div class="control-group">
            <label for="bg-color">Background</label>
            <div class="color-input-wrap">
              <input type="color" id="bg-color" value="#6366f1">
              <span class="color-hex" id="bg-color-hex">#6366f1</span>
            </div>
          </div>
          <div class="control-group">
            <label for="text-color">Text Color</label>
            <div class="color-input-wrap">
              <input type="color" id="text-color" value="#ffffff">
              <span class="color-hex" id="text-color-hex">#ffffff</span>
            </div>
          </div>
        </div>

        <div class="control-group">
          <label for="font-select">Font</label>
          <select id="font-select">
            <option value="Inter, sans-serif">Inter</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="Verdana, sans-serif">Verdana</option>
            <option value="Impact, sans-serif">Impact</option>
            <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
            <option value="system-ui, sans-serif">System UI</option>
          </select>
        </div>

        <div class="control-group">
          <label for="border-radius">Border Radius <span class="slider-value" id="radius-value">0%</span></label>
          <input type="range" id="border-radius" min="0" max="50" value="0">
        </div>

        <div class="control-group">
          <label for="font-size">Font Size <span class="slider-value" id="font-size-value">70%</span></label>
          <input type="range" id="font-size" min="30" max="100" value="70">
        </div>

        <div class="divider"></div>

        <h2>Upload Image</h2>
        <div class="upload-area" id="upload-area">
          <div class="upload-content">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
            <span>Drop image here or click to upload</span>
          </div>
          <input type="file" id="file-input" accept="image/*" hidden>
        </div>
        <button class="btn btn-secondary" id="clear-upload" style="display:none;">Clear Upload</button>
      </section>

      <section class="panel preview-panel">
        <h2>Preview</h2>
        <div class="preview-grid" id="preview-grid"></div>

        <div class="divider"></div>

        <h2>Download</h2>
        <div class="download-buttons">
          <button class="btn btn-primary" id="download-ico">Download ICO</button>
          <button class="btn btn-primary" id="download-png-16">PNG 16x16</button>
          <button class="btn btn-primary" id="download-png-32">PNG 32x32</button>
          <button class="btn btn-primary" id="download-png-48">PNG 48x48</button>
          <button class="btn btn-primary" id="download-png-180">PNG 180x180</button>
          <button class="btn btn-primary" id="download-png-192">PNG 192x192</button>
          <button class="btn btn-primary" id="download-svg">Download SVG</button>
        </div>

        <div class="divider"></div>

        <h2>HTML Tags</h2>
        <pre class="code-block" id="html-tags"></pre>
        <button class="btn btn-secondary" id="copy-html">Copy HTML Tags</button>
      </section>
    </div>

    <canvas id="render-canvas" hidden></canvas>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="app.js"></script>
</body>
</html>
