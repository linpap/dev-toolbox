<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Minifier / Beautifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-left">
        <h1 class="logo"><span class="logo-accent">{</span> JS Minifier <span class="logo-accent">}</span></h1>
        <span class="subtitle">Minify &amp; Beautify</span>
      </div>
      <div class="header-right">
        <label class="upload-btn" tabindex="0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          Upload .js
          <input type="file" id="fileInput" accept=".js,.mjs,.cjs,.ts" hidden>
        </label>
      </div>
    </header>

    <div class="toolbar">
      <div class="toolbar-actions">
        <button class="btn btn-primary" id="minifyBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/><line x1="14" y1="10" x2="21" y2="3"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          Minify
        </button>
        <button class="btn btn-secondary" id="beautifyBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
          Beautify
        </button>
      </div>
      <div class="toolbar-secondary">
        <button class="btn btn-ghost" id="copyBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy
        </button>
        <button class="btn btn-ghost" id="downloadBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download
        </button>
        <button class="btn btn-ghost" id="clearBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear
        </button>
      </div>
    </div>

    <div class="stats-bar">
      <div class="stat">
        <span class="stat-label">Input</span>
        <span class="stat-value" id="inputSize">0 B</span>
      </div>
      <div class="stat">
        <span class="stat-label">Output</span>
        <span class="stat-value" id="outputSize">0 B</span>
      </div>
      <div class="stat">
        <span class="stat-label">Savings</span>
        <span class="stat-value stat-highlight" id="savings">0%</span>
      </div>
      <div class="stat">
        <span class="stat-label">Lines</span>
        <span class="stat-value" id="lineCount">0 / 0</span>
      </div>
      <div class="stat">
        <span class="stat-label">Functions</span>
        <span class="stat-value" id="funcCount">0</span>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Input</span>
          <span class="panel-info" id="inputLines">0 lines</span>
        </div>
        <textarea
          id="inputEditor"
          class="editor"
          spellcheck="false"
          placeholder="Paste your JavaScript here..."
        ></textarea>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Output</span>
          <span class="panel-info" id="outputLines">0 lines</span>
        </div>
        <div class="output-wrapper">
          <pre id="outputEditor" class="editor output-display"><code id="outputCode"></code></pre>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
