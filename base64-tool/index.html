<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder / Decoder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <header>
            <h1>Base64 <span class="accent">&lt;/&gt;</span></h1>
            <p class="subtitle">Encode and decode Base64 strings instantly.</p>
        </header>

        <div class="toolbar">
            <div class="toolbar-group">
                <button id="encodeBtn" class="tool-btn primary">Encode</button>
                <button id="decodeBtn" class="tool-btn">Decode</button>
                <button id="swapBtn" class="tool-btn" title="Swap input and output">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="17 1 21 5 17 9"></polyline>
                        <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
                        <polyline points="7 23 3 19 7 15"></polyline>
                        <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
                    </svg>
                    Swap
                </button>
                <button id="clearBtn" class="tool-btn">Clear</button>
            </div>
            <div class="toolbar-group">
                <label class="toggle-row">
                    <span>Real-time</span>
                    <input type="checkbox" id="realtimeToggle" checked>
                    <span class="toggle"></span>
                </label>
                <label class="toggle-row">
                    <span>URL-safe</span>
                    <input type="checkbox" id="urlSafeToggle">
                    <span class="toggle"></span>
                </label>
            </div>
        </div>

        <div class="editor-container">
            <div class="panel input-panel">
                <div class="panel-header">
                    <span>Input</span>
                    <span id="inputCount" class="char-count">0 chars</span>
                </div>
                <textarea id="inputArea" placeholder="Type or paste text here..." spellcheck="false"></textarea>
                <div id="dropZone" class="drop-zone">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="17 8 12 3 7 8"></polyline>
                        <line x1="12" y1="3" x2="12" y2="15"></line>
                    </svg>
                    <span>Drop a file here or <label for="fileInput" class="file-label">browse</label></span>
                    <input type="file" id="fileInput" hidden>
                </div>
            </div>
            <div class="panel output-panel">
                <div class="panel-header">
                    <span>Output</span>
                    <div class="panel-header-right">
                        <span id="outputCount" class="char-count">0 chars</span>
                        <button id="copyBtn" class="copy-btn" title="Copy to clipboard">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <textarea id="outputArea" placeholder="Result will appear here..." spellcheck="false" readonly></textarea>
            </div>
        </div>

        <div id="statusBar" class="status-bar">
            <span id="statusIcon" class="status-icon"></span>
            <span id="statusMessage" class="status-message">Ready</span>
        </div>
    </div>

    <div id="dropOverlay" class="drop-overlay">
        <div class="drop-message">Drop file to encode</div>
    </div>

    <div id="toast" class="toast">Copied to clipboard</div>

    <script src="app.js"></script>
</body>
</html>
